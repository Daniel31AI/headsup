<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Čelovka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu">
        <h1 id="hlavni-nadpis">Čelovka<br><span class="autor">by Daniel Štráchal</span></h1>
        
        <div class="nastaveni">
            <label for="cas">Čas (vteřiny): </label>
            <input type="number" id="cas" value="60" min="10" max="120">
        </div>

        <h2>Vyber kategorie (můžeš jich označit více)</h2>
        <div class="tlacitka-kategorie" id="seznam-kategorii">
            <!-- Tlačítka se vygenerují přes JavaScript -->
        </div>
        
        <div id="start-panel" style="display: none;">
            <button id="btn-hrat" onclick="pripravHru()">Hrát vybrané</button>
        </div>
    </div>

    <div id="priprava" style="display: none;" onclick="odstartujOdpotocet()">
        <h2 id="priprava-text">Klepnutím na obrazovku začneš hru</h2>
    </div>

    <div id="hra" style="display: none;">
        <button id="btn-krizek" onclick="ukoncitHru()">✖</button>
        <div id="casomira">60</div>
        <h2 id="slovo">...</h2>
    </div>

    <div id="vysledky" style="display: none;">
        <h2>Konec hry!</h2>
        <div class="vysledky-blok">
            <h3 class="zelena">Uhodnuto (<span id="pocet-uhodnuto">0</span>)</h3>
            <ul id="seznam-uhodnuto"></ul>
        </div>
        <div class="vysledky-blok">
            <h3 class="cervena">Přeskočeno (<span id="pocet-preskoceno">0</span>)</h3>
            <ul id="seznam-preskoceno"></ul>
        </div>
        <button class="btn-zpet" onclick="zpetDoMenu()">Zpět do menu</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
