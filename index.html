<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Čelovka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu">
        <h1>Čelovka</h1>
        
        <div class="nastaveni">
            <label for="cas">Čas (vteřiny): </label>
            <input type="number" id="cas" value="60" min="10" max="120">
        </div>

        <h2>Vyber kategorii</h2>
        <div class="tlacitka-kategorie">
            <button onclick="zacniHru('zeme')">Země</button>
            <button onclick="zacniHru('zvirata')">Zvířata</button>
            <button onclick="zacniHru('povolani')">Povolání</button>
            <button onclick="zacniHru('filmy')">Světové filmy a seriály</button>
            <button onclick="zacniHru('obleceni')">Značky oblečení</button>
            <button onclick="zacniHru('firmy')">Světové firmy</button>
            <button onclick="zacniHru('cz_filmy')">České filmy</button>
            <button onclick="zacniHru('cz_serialy')">České seriály</button>
            <button onclick="zacniHru('sk_filmy')">Slovenské filmy</button>
            <button onclick="zacniHru('sk_serialy')">Slovenské seriály</button>
            <button onclick="zacniHru('cz_herci')">Čeští herci</button>
            <button onclick="zacniHru('cz_hudba')">České písničky</button>
            <button onclick="zacniHru('svet_hudba')">Světové písničky</button>
            <button onclick="zacniHru('sk_hudba')">Slovenské písničky</button>
            <button onclick="zacniHru('nhl')">Týmy NHL</button>
            <button onclick="zacniHru('extraliga_cz')">CZ Tipsport Extraliga</button>
            <button onclick="zacniHru('extraliga_sk')">SK Hokejová Extraliga</button>
        </div>
    </div>

    <div id="hra" style="display: none;">
        <button id="btn-krizek" onclick="ukoncitHru()">✖</button>
        <div id="casomira">60</div>
        <h2 id="slovo">Polož si telefon na čelo...</h2>
    </div>

    <div id="vysledky" style="display: none;">
        <h2>Konec hry!</h2>
        <div class="vysledky-blok">
            <h3 class="zelena">Uhodnuto (<span id="pocet-uhodnuto">0</span>)</h3>
            <ul id="seznam-uhodnuto"></ul>
        </div>
        <div class="vysledky-blok">
            <h3 class="cervena">Přeskočeno (<span id="pocet-preskoceno">0</span>)</h3>
            <ul id="seznam-preskoceno"></ul>
        </div>
        <button class="btn-zpet" onclick="zpetDoMenu()">Zpět do menu</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
